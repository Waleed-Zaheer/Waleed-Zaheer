name: Refresh README stats

# Regenerates the SVGs the README embeds and commits them as static files
# in ./assets. The README links to those local files, never to a live
# third-party rendering service — so a service outage (e.g. the frequent
# github-readme-stats.vercel.app 503s) can never show up as a broken image
# on the profile page. Worst case, a run fails and the previous good SVG
# just stays until the next successful run.

on:
  schedule:
    # Every 2 hours, off the hour to avoid GitHub's cron rush. Daily wasn't
    # enough — it snapshots "today" once, early, so a day's contributions
    # make afterward don't show until the *next* day's run. This keeps
    # today's bar catching up throughout the day instead.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-stats.yml"
      - "scripts/generate-top-langs.mjs"
      - "scripts/add-graph-tooltips.mjs"

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate top languages card (talks directly to GitHub's API)
        env:
          GH_USERNAME: waleed-zaheer
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-top-langs.mjs

      - name: Refresh remaining cards from their live generators
        shell: bash
        run: |
          set -u
          mkdir -p assets

          # $3 (optional) is a substring that must appear in a *valid* card,
          # e.g. "Total Contributions" for the streak card. These generators
          # respond with a perfectly valid <svg> error card (rate limits,
          # upstream GitHub API hiccups, etc.) that would otherwise sail
          # through a bare "<svg" check and clobber the last good render.
          # Retries a few times since these errors are often transient.
          fetch_svg() {
            local url="$1"
            local out="$2"
            local marker="${3:-}"
            local tmp attempt
            for attempt in 1 2 3; do
              tmp="$(mktemp)"
              if curl -fsSL --max-time 30 -A "waleed-zaheer-readme" "$url" -o "$tmp" \
                 && [ -s "$tmp" ] && grep -q "<svg" "$tmp" \
                 && { [ -z "$marker" ] || grep -qF "$marker" "$tmp"; }; then
                mv "$tmp" "$out"
                echo "updated $out"
                return 0
              fi
              rm -f "$tmp"
              [ "$attempt" -lt 3 ] && sleep 5
            done
            echo "::warning::fetch failed for $out after 3 attempts, keeping previous cached version"
          }

          fetch_svg "https://streak-stats.demolab.com/?user=waleed-zaheer&theme=tokyonight&hide_border=false" \
            assets/streak-stats.svg "Total Contributions"

          fetch_svg "https://github-readme-activity-graph.vercel.app/graph?username=waleed-zaheer&theme=tokyo-night&hide_border=true&area=true&count_private=true" \
            assets/activity-graph.svg "ct-chart"

          fetch_svg "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=waleed-zaheer&theme=tokyonight" \
            assets/profile-details.svg "gpsc-root"

      - name: Add hover tooltips to the activity graph points
        run: node scripts/add-graph-tooltips.mjs

      - name: Commit changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh readme stats [skip ci]"
          file_pattern: "assets/*.svg"
